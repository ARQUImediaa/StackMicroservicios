services:
  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: proyectomicro
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  cassandra-init:
    image: cassandra:5.0
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command: >
      cqlsh cassandra 9042 -f /init/schema.cql &&
      cqlsh cassandra 9042 -f /init/seed.cql
    volumes:
      - ./infra/cassandra/schema.cql:/init/schema.cql:ro
      - ./infra/cassandra/seed.cql:/init/seed.cql:ro
    restart: "no"

  community-service:
    build:
      context: .
      dockerfile: services/community-service/Dockerfile
    environment:
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_PORT: "9042"
      GRPC_PORT: "50051"
    expose:
      - "50051"
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    restart: unless-stopped

  message-service:
    build:
      context: .
      dockerfile: services/message-service/Dockerfile
    environment:
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_PORT: "9042"
      COMMUNITY_SERVICE_ADDR: community-service:50051
      GRPC_PORT: "50052"
    expose:
      - "50052"
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
      community-service:
        condition: service_started
    restart: unless-stopped

  envoy:
    image: envoyproxy/envoy:v1.31.2
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--service-cluster", "proyectomicro"]
    ports:
      - "8080:8080"
    volumes:
      - ./infra/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - community-service
      - message-service
    restart: unless-stopped

volumes:
  cassandra_data:
