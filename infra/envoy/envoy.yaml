static_resources:
  listeners:
    - name: grpc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_ingress
                codec_type: AUTO
                # Envoy genera un x-request-id por petición y lo reenvía a los servicios;
                # así un mismo id recorre Envoy → message-service → community-service.
                generate_request_id: true
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          service: envoy
                          msg: access
                          request_id: "%REQ(X-REQUEST-ID)%"
                          path: "%REQ(:PATH)%"
                          grpc_status: "%GRPC_STATUS(SNAKE_STRING)%"
                          duration_ms: "%DURATION%"
                          upstream_host: "%UPSTREAM_HOST%"
                route_config:
                  name: grpc_routes
                  virtual_hosts:
                    - name: grpc_services
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /grpc.reflection.v1.ServerReflection/
                          route:
                            cluster: community_service
                            timeout: 5s
                        - match:
                            prefix: /grpc.reflection.v1alpha.ServerReflection/
                          route:
                            cluster: community_service
                            timeout: 5s
                        - match:
                            prefix: /community.v1.CommunityService/
                          route:
                            cluster: community_service
                            timeout: 0s
                        - match:
                            prefix: /messaging.v1.MessagingService/
                          route:
                            cluster: message_service
                            timeout: 0s
                        - match:
                            prefix: /grpc.health.v1.Health/
                          route:
                            cluster: community_service
                            timeout: 5s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: community_service
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: community_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: community-service
                      port_value: 50051
    - name: message_service
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: message_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: message-service
                      port_value: 50052